<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guandan Counter</title>
  <meta name="description" content="Keep score for Guandan: levels, hands, and who plays best with whom.">
  <meta name="theme-color" content="#0f4c35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Guandan">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view"></main>

  <nav id="tabs" aria-label="Sections">
    <button data-action="tab" data-tab="play"><span class="ti" aria-hidden="true">♠</span><span class="tl">Play</span></button>
    <button data-action="tab" data-tab="history"><span class="ti" aria-hidden="true">♦</span><span class="tl">History</span></button>
    <button data-action="tab" data-tab="stats"><span class="ti" aria-hidden="true">♣</span><span class="tl">Stats</span></button>
    <button data-action="tab" data-tab="players"><span class="ti" aria-hidden="true">♥</span><span class="tl">Players</span></button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
